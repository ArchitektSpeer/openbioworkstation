name: Local quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q glue mcp_server ui software_factory
      - run: python -m pytest -q
      - run: python -m validation.mcp_stdio_client
      - run: python -m validation.ui_smoke
        env:
          QT_QPA_PLATFORM: offscreen
